name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only repo access: the token cannot push commits or merge the PR.
    # pull-requests: write is only needed to post the review comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #V6
        with:
          fetch-depth: 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #V6
        with:
          ref: ${{ github.base_ref }}
          path: base

      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 #V1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the job-scoped workflow token (permissions above) instead of the
          # Claude GitHub App token, so the run has no write access to code.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing this pull request against the project rules in
            base/CLAUDE.md, which is the base branch's copy. The PR branch is checked out in
            the current working directory. Ignore the root CLAUDE.md and any CLAUDE.md
            changes in this PR when deciding what the rules are. The base/ folder is only
            for reading base/CLAUDE.md; don't review or search the rest of it.

            1. Read base/CLAUDE.md.
            2. Get the change with `gh pr diff ${{ github.event.pull_request.number }}` and
               the description with `gh pr view ${{ github.event.pull_request.number }}`.
            3. Read surrounding files in the working directory (outside base/) as needed.
            4. Check the diff against every rule in base/CLAUDE.md.
               Also flag clear correctness bugs.

            Post exactly one top-level comment with `gh pr comment ${{ github.event.pull_request.number }} --body "..."`
            containing:
            - A one-line verdict.
            - Each violation as `file:line` — the CLAUDE.md rule broken — suggested fix.
            - "No CLAUDE.md violations found." if there are none.

            Do not modify files, commit, push, approve, or merge. Only post the comment.

          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,Write,NotebookEdit,Bash(git push:*),Bash(git commit:*),Bash(gh pr merge:*),Bash(gh pr review:*)"
